<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fifth Official — Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#152C5B; --navy-d:#0D1D3F; --red:#C8102E;
  --ink:#16181D; --mid:#5A6273; --line:#B9BEC6; --rule:#E4E8ED;
  --wash:#F4F6F9; --row:#EFF2F6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--wash);color:var(--ink);font-size:15px;line-height:1.45}

/* ---------- chrome ---------- */
#chrome{max-width:1080px;margin:0 auto;padding:0 20px 60px}
header.top{background:var(--navy-d);color:#fff;padding:16px 20px;margin:0 -20px 0}
header.top .bar{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:14px}
.mk{width:26px;height:38px;position:relative;flex:0 0 auto}
.mk i{position:absolute;top:0;bottom:0;display:block}
.mk .s{left:0;width:6px;background:var(--red)}
.mk .c{left:6px;width:17px;background:#fff}
.mk .p{left:23px;width:3px;background:#5A6273}
.mk b{position:absolute;left:11px;height:3px;background:var(--navy-d);display:block}
.wm{font-weight:700;font-size:19px;letter-spacing:-0.01em;line-height:1}
.wm span{color:var(--red)}
.wm small{display:block;font-weight:400;font-size:9.5px;letter-spacing:.08em;color:#8FA0BD;margin-top:4px}
header.top .sp{flex:1}
.btn{background:#fff;border:1px solid var(--line);color:var(--navy);font:inherit;font-size:13.5px;
  font-weight:600;padding:8px 14px;border-radius:2px;cursor:pointer}
.btn:hover{background:var(--row)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;border-color:#3C5080;color:#fff}

/* ---------- gate ---------- */
#gate{max-width:340px;margin:16vh auto;background:#fff;border:1px solid var(--rule);padding:28px}
#gate h1{font-size:17px;margin:0 0 4px;color:var(--navy)}
#gate p{font-size:13.5px;color:var(--mid);margin:0 0 18px}
#gate input{width:100%;font:inherit;font-size:20px;letter-spacing:.3em;text-align:center;
  padding:12px;border:1px solid var(--line);border-radius:2px}
#gate button{width:100%;margin-top:12px;background:var(--navy);color:#fff;border:0;
  font:inherit;font-weight:600;padding:12px;border-radius:2px;cursor:pointer}
#gate .no{display:none;color:var(--red);font-size:13px;margin-top:10px;text-align:center}

/* ---------- list ---------- */
.toolbar{display:flex;align-items:center;gap:10px;padding:18px 0 12px;flex-wrap:wrap}
.toolbar h2{font-size:15px;margin:0;color:var(--navy)}
.toolbar .sp{flex:1}
table.list{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--rule)}
table.list th{background:var(--navy);color:#fff;font-size:11.5px;letter-spacing:.04em;
  text-align:left;padding:9px 12px;font-weight:600}
table.list td{padding:10px 12px;border-top:1px solid var(--rule);font-size:14px;vertical-align:top}
table.list tr:nth-child(even) td{background:var(--row)}
table.list a{color:var(--navy);font-weight:600;text-decoration:none;cursor:pointer}
table.list a:hover{text-decoration:underline}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:2px;
  background:var(--rule);color:var(--mid)}
.tag.red{background:#FBE3E7;color:#9E0C24}
.muted{color:var(--mid);font-size:13px}
#status{padding:40px 0;text-align:center;color:var(--mid);font-size:14px}

/* ---------- documents ---------- */
#docs{display:none}
.doc{background:#fff;border:1px solid var(--rule);padding:44px 48px;margin:0 0 22px;
  font-family:"Source Serif 4",Georgia,serif;font-size:13px;line-height:1.5;color:#111}
.doc .fed{text-align:center;border-bottom:2px solid #111;padding-bottom:9px;margin-bottom:16px}
.doc .fed .org{font-family:Inter,sans-serif;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:#444}
.doc .fed .nm{font-family:Inter,sans-serif;font-size:20px;font-weight:700;margin-top:3px;color:#111}
.doc .note{font-size:11.5px;color:#555;margin:0 0 16px;line-height:1.45}
.doc h3{font-family:Inter,sans-serif;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
  color:#111;border-bottom:1px solid #111;padding-bottom:4px;margin:20px 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 34px}
.fld{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px dotted #BBB}
.fld .lb{font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;
  color:#555;white-space:nowrap}
.fld .vl{flex:1;font-weight:600;color:#111}
table.f{width:100%;border-collapse:collapse;margin:6px 0 2px;font-size:12.5px}
table.f th{font-family:Inter,sans-serif;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
  text-align:left;padding:5px 7px;border:1px solid #999;background:#EEE;color:#333;font-weight:600}
table.f td{padding:6px 7px;border:1px solid #999;height:24px}
.empty{font-size:12px;color:#777;font-style:italic;padding:6px 0}
.stmt{border:1px solid #999;padding:12px;min-height:150px;white-space:pre-wrap;line-height:1.6}
.sig{margin-top:26px;padding-top:12px;border-top:1px solid #111}
.rosters{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.rosters img{max-width:47%;border:1px solid #999}

/* checklist doc */
.ckdoc{background:#fff;border:1px solid var(--rule);padding:0;margin:0 0 22px;overflow:hidden}
.ckdoc .hd{background:#152C5B;color:#fff;padding:14px 20px}
.ckdoc .hd .t{font-family:Inter,sans-serif;font-weight:700;font-size:19px;letter-spacing:-0.01em}
.ckdoc .hd .s{font-size:11.5px;color:#B9C4D8;margin-top:2px}
.ckdoc .band{background:#C8102E;color:#fff;text-align:center;font-size:10.5px;font-weight:700;
  letter-spacing:.06em;padding:4px}
.ckdoc table{width:100%;border-collapse:collapse;font-size:13.5px}
.ckdoc td{padding:7px 20px;border-bottom:1px solid var(--rule)}
.ckdoc tr:nth-child(odd) td{background:var(--row)}
.ckdoc .n{width:34px;color:var(--red);font-weight:700;font-size:12px}
.ckdoc .r{width:66px;text-align:right;font-weight:700;font-size:12px}
.ckdoc .yes{color:#1B7A45}
.ckdoc .no{color:var(--red)}
.ckdoc .foot{padding:12px 20px;font-size:12.5px;color:var(--mid)}

/* summary doc */
.sum{background:#fff;border:1px solid var(--rule);padding:36px 40px;margin:0 0 22px}
.sum .hd{display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--navy);padding-bottom:12px}
.sum h1{font-size:21px;margin:0;color:var(--navy);letter-spacing:-0.01em}
.sum h1 small{display:block;font-size:11px;font-weight:400;letter-spacing:.07em;color:var(--mid);margin-top:3px}
.sum h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--navy);
  padding:6px 12px;margin:24px 0 0}
.sum h3.r{background:var(--red)}
.sum table{width:100%;border-collapse:collapse;font-size:13.5px}
.sum th{text-align:left;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mid);
  padding:7px 12px;border-bottom:1px solid var(--line)}
.sum td{padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.sum tr:last-child td{border-bottom:0}
.sum .none{padding:12px;color:var(--mid);font-size:13.5px}
.sum .team{font-weight:700;color:var(--navy)}
.sum .acct{font-size:12.5px;color:#333;line-height:1.5}

@media print{
  body{background:#fff}
  header.top,.toolbar,.noprint{display:none!important}
  #chrome{max-width:none;padding:0}
  .doc,.ckdoc,.sum{border:0;margin:0;padding:26px 0;page-break-after:always}
  .doc:last-child,.ckdoc:last-child,.sum:last-child{page-break-after:auto}
  @page{margin:14mm}
}
</style>
</head>
<body>

<div id="gate">
  <h1>Fifth Official</h1>
  <p>Reports and documents</p>
  <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" autocomplete="off">
  <button id="go">Open</button>
  <div class="no" id="bad">Wrong PIN</div>
</div>

<div id="chrome" style="display:none">
  <header class="top">
    <div class="bar">
      <span class="mk"><i class="s"></i><i class="c"></i><i class="p"></i>
        <b style="top:11px;width:9px"></b><b style="top:18px;width:9px"></b><b style="top:25px;width:6px"></b></span>
      <span class="wm">FIFTH <span>OFFICIAL</span><small>MATCH REPORTING</small></span>
      <span class="sp"></span>
      <button class="btn ghost noprint" id="backBtn" style="display:none">All reports</button>
    </div>
  </header>

  <div id="listView">
    <div class="toolbar">
      <h2>Submitted reports</h2>
      <span class="sp"></span>
      <button class="btn" id="reload">Refresh</button>
      <button class="btn pri" id="weekend">Weekend summary</button>
    </div>
    <div id="status">Loading…</div>
    <table class="list" id="tbl" style="display:none">
      <thead><tr><th>Match</th><th>Division</th><th>Score</th><th>Filed by</th><th>Discipline</th><th>Received</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div id="docs">
    <div class="toolbar noprint">
      <h2 id="docTitle"></h2>
      <span class="sp"></span>
      <button class="btn pri" onclick="window.print()">Print / save as PDF</button>
    </div>
    <div id="docBody"></div>
  </div>
</div>

<script>
const AT = {
  base:"appIrR3CNhDY5dw5s",
  token:"patoOZOeduxVbX8Gy.d6b45069ca5acef13403b9a657aac8f4f2fbfbf32942a9ed049af20e2413de0e",
  reports:"tblcu4aWHYAwRI3jL", discipline:"tbl5leWcUi2bmg9Ko",
  subs:"tblJ3Z2xAQjkK9oOJ", goals:"tbl6yU0GcKdh1fCft"
};
const PIN = "3470";

const CHECKS = [
 "Access to field 60 minutes prior to kick-off",
 "Athletic trainer on site, between the technical areas",
 "Field properly marked and in good condition",
 "Goals properly anchored",
 "Nets set up, tied and secured",
 "Four UPSL Voit match balls provided by home team",
 "Water provided by home team for referees",
 "Ice provided in a cooler by home team",
 "Referee crew table and chairs provided",
 "National anthem played",
 "US flag displayed",
 "Bench players in pinnies \u2014 home team",
 "Bench players in pinnies \u2014 away team",
 "International walk out, both teams"
];
/* item 13 (index 12) is the away team's responsibility; everything else is the home team's */
const AWAY_ITEM = 13;

const $ = id => document.getElementById(id);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let DATA = null;

/* ---------- gate ---------- */
function unlock(){
  if($("pin").value !== PIN){ $("bad").style.display="block"; return; }
  $("gate").style.display="none"; $("chrome").style.display="block"; load();
}
$("go").addEventListener("click", unlock);
$("pin").addEventListener("keydown", e=>{ if(e.key==="Enter") unlock(); });

/* ---------- data ---------- */
async function grab(table){
  let out=[], offset=null;
  do{
    const u = new URL(`https://api.airtable.com/v0/${AT.base}/${table}`);
    u.searchParams.set("pageSize","100");
    if(offset) u.searchParams.set("offset", offset);
    const r = await fetch(u, {headers:{Authorization:`Bearer ${AT.token}`}});
    if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error((j.error&&(j.error.message||j.error.type))||`HTTP ${r.status}`); }
    const j = await r.json();
    out = out.concat(j.records);
    offset = j.offset;
  } while(offset);
  return out;
}

async function load(){
  $("status").style.display="block";
  $("status").textContent="Loading…";
  $("tbl").style.display="none";
  try{
    const [reports, disc, subs, goals] = await Promise.all(
      [AT.reports, AT.discipline, AT.subs, AT.goals].map(grab));
    DATA = {reports, disc, subs, goals};
    render();
  }catch(e){
    $("status").innerHTML = `Could not load reports.<br><span class="muted">${esc(e.message)}</span>`;
  }
}
$("reload").addEventListener("click", load);

const kids = (arr, rid) => arr.filter(r => (r.fields["Report"]||[]).includes(rid)).map(r=>r.fields);

function render(){
  const rs = DATA.reports.slice().sort((a,b)=>
    (b.fields["Submitted At"]||"").localeCompare(a.fields["Submitted At"]||""));
  if(!rs.length){
    $("status").textContent = "No reports submitted yet.";
    return;
  }
  $("status").style.display="none";
  $("tbl").style.display="table";
  $("rows").innerHTML = rs.map(r=>{
    const f=r.fields;
    const cards = kids(DATA.disc, r.id);
    const reds = cards.filter(c=>c["Card"]==="Send-off").length;
    const yels = cards.length - reds;
    const fails = (f["Checklist Failures"]||"").split("\n").filter(Boolean).length;
    let d = [];
    if(reds) d.push(`<span class="tag red">${reds} send-off${reds>1?"s":""}</span>`);
    if(yels) d.push(`<span class="tag">${yels} caution${yels>1?"s":""}</span>`);
    if(fails) d.push(`<span class="tag red">${fails} violation${fails>1?"s":""}</span>`);
    const when = f["Submitted At"] ? new Date(f["Submitted At"]).toLocaleString(undefined,
      {weekday:"short",hour:"numeric",minute:"2-digit"}) : "";
    return `<tr>
      <td><a data-id="${r.id}">${esc(f["Match"]||f["Match ID"]||"—")}</a>
          <div class="muted">${esc(f["Kickoff"]||"")}</div></td>
      <td>${esc(f["Division"]||"")}</td>
      <td>${f["Home Score"]??"–"} &ndash; ${f["Away Score"]??"–"}</td>
      <td>${esc(f["Submitted By"]||"")}<div class="muted">${esc(f["Role"]||"")}</div></td>
      <td>${d.join(" ")||'<span class="muted">clean</span>'}</td>
      <td class="muted">${esc(when)}</td>
    </tr>`;
  }).join("");
  $("rows").querySelectorAll("a[data-id]").forEach(a=>
    a.addEventListener("click", ()=> openMatch(a.dataset.id)));
}

/* ---------- helpers ---------- */
function teams(f){
  const m = (f["Match"]||"").split(" v ");
  return {home:(m[0]||"Home").trim(), away:(m[1]||"Away").trim()};
}
function fld(lb,vl){ return `<div class="fld"><span class="lb">${lb}</span><span class="vl">${esc(vl||"")}</span></div>`; }
function fails(f){ return (f["Checklist Failures"]||"").split("\n").map(s=>s.trim()).filter(Boolean); }
function failNum(line){ const m=line.match(/^(\d+)\./); return m?+m[1]:0; }

/* ---------- documents ---------- */
function refereeReport(f, cards){
  const t = teams(f);
  const cau = cards.filter(c=>c["Card"]==="Caution");
  const snd = cards.filter(c=>c["Card"]==="Send-off");
  const rowsOf = list => list.length ? list.map(c=>`<tr>
      <td>${esc(c["Player Name"])}</td><td>${esc(c["Player Number"])}</td>
      <td>${esc(c["Team"])}</td><td>${esc(c["Offense"])}</td></tr>`).join("")
    : `<tr><td colspan="4" style="text-align:center;color:#777;font-style:italic">None</td></tr>`;
  return `<div class="doc">
    <div class="fed"><div class="org">U.S. Soccer Federation Referee Program</div>
      <div class="nm">Referee Report</div></div>
    <p class="note">Submitted to the competition authority. Where a send-off, dismissal of a team official,
      serious injury, abandonment or other substantial occurrence took place, a Supplemental Referee Report
      accompanies this document.</p>
    <div class="grid2">
      ${fld("Home Team", t.home)}${fld("Score", f["Home Score"])}
      ${fld("Away Team", t.away)}${fld("Score", f["Away Score"])}
      ${fld("Association / League", "United Premier Soccer League — North Conference")}${fld("Division / Age Group", f["Division"])}
      ${fld("Game Number", f["Match ID"])}${fld("Game Date", f["Kickoff"])}
    </div>
    <h3>Match Officials</h3>
    <div class="grid2">
      ${fld("Referee", f["Referee"])}${fld("Grade", "")}
      ${fld("Assistant Referee 1", f["AR1"])}${fld("Grade", "")}
      ${fld("Assistant Referee 2", f["AR2"])}${fld("Grade", "")}
      ${fld("Fourth Official", f["Fourth Official"])}${fld("Grade", "")}
    </div>
    <h3>Cautions / Yellow Cards</h3>
    <table class="f"><thead><tr><th>Name</th><th>Pass / ID Number</th><th>Team</th><th>Misconduct Code</th></tr></thead>
      <tbody>${rowsOf(cau)}</tbody></table>
    <h3>Send Offs / Red Cards</h3>
    <table class="f"><thead><tr><th>Name</th><th>Pass / ID Number</th><th>Team</th><th>Misconduct Code</th></tr></thead>
      <tbody>${rowsOf(snd)}</tbody></table>
    <div class="sig grid2">
      ${fld("Name", f["Submitted By"])}${fld("Date", (f["Submitted At"]||"").slice(0,10))}
      ${fld("USSF ID Number", "")}${fld("Phone Number", "")}
      ${fld("Email Address", "")}${fld("Position", f["Role"])}
    </div>
  </div>`;
}

function fourthReport(f, cards, subs, goals){
  const t = teams(f);
  const side = (list, team, cols) => {
    const rows = list.filter(x=>x["Team"]===team);
    if(!rows.length) return `<tr><td colspan="${cols}" style="text-align:center;color:#777;font-style:italic">None</td></tr>`;
    return rows.map(r=>cols===2
      ? `<tr><td>${esc(r["Scorer Number"])}</td><td>${esc(r["Minute"])}</td></tr>`
      : cols===3 && r["Player In"]!==undefined
      ? `<tr><td>${esc(r["Player In"])}</td><td>${esc(r["Player Out"])}</td><td>${esc(r["Minute"])}</td></tr>`
      : `<tr><td>${esc(r["Player Number"])}</td><td>${esc(r["Minute"])}</td><td>${esc(r["Offense"])}</td></tr>`
    ).join("");
  };
  const block = team => `
    <h3>${esc(team)}</h3>
    <table class="f"><thead><tr><th colspan="2">Goals</th></tr>
      <tr><th>#</th><th>Minute</th></tr></thead><tbody>${side(goals,team,2)}</tbody></table>
    <table class="f"><thead><tr><th colspan="3">Substitutions</th></tr>
      <tr><th># In</th><th># Out</th><th>Minute</th></tr></thead><tbody>${side(subs,team,3)}</tbody></table>
    <table class="f"><thead><tr><th colspan="3">Misconduct</th></tr>
      <tr><th>#</th><th>Minute</th><th>Code</th></tr></thead><tbody>${side(cards,team,4)}</tbody></table>`;
  return `<div class="doc">
    <div class="fed"><div class="org">U.S. Soccer Federation Referee Program</div>
      <div class="nm">Fourth Official Report</div></div>
    <p class="note">Match data collected to assist the referee in completing the game report required by the
      competition authority.</p>
    <div class="grid2">
      ${fld("Home Team", t.home)}${fld("Score", f["Home Score"])}
      ${fld("Away Team", t.away)}${fld("Score", f["Away Score"])}
      ${fld("Association / League", "United Premier Soccer League — North Conference")}${fld("Division / Age Group", f["Division"])}
      ${fld("Game Number", f["Match ID"])}${fld("Game Date", f["Kickoff"])}
    </div>
    <div class="grid2">
      ${fld("Referee", f["Referee"])}${fld("Grade", "")}
      ${fld("Assistant Referee 1", f["AR1"])}${fld("Grade", "")}
      ${fld("Assistant Referee 2", f["AR2"])}${fld("Grade", "")}
      ${fld("Fourth Official", f["Fourth Official"])}${fld("Grade", "")}
    </div>
    ${block(t.home)}
    ${block(t.away)}
    <h3>Notes</h3>
    <div class="stmt" style="min-height:70px">${esc(f["Match Notes"]||"")}</div>
  </div>`;
}

function supplemental(f, c){
  const t = teams(f);
  return `<div class="doc">
    <div class="fed"><div class="org">U.S. Soccer Federation Referee Program</div>
      <div class="nm">Supplemental Referee Report</div></div>
    <p class="note">Filed with the Referee Report for a send-off offence.</p>
    <div class="grid2">
      ${fld("Home Team", t.home)}${fld("Score", f["Home Score"])}
      ${fld("Away Team", t.away)}${fld("Score", f["Away Score"])}
      ${fld("Association / League", "United Premier Soccer League — North Conference")}${fld("Division / Age Group", f["Division"])}
      ${fld("Game Number", f["Match ID"])}${fld("Game Date", f["Kickoff"])}
    </div>
    <h3>Player Dismissed</h3>
    <div class="grid2">
      ${fld("Name", c["Player Name"])}${fld("Number", c["Player Number"])}
      ${fld("Team", c["Team"])}${fld("Minute", c["Minute"])}
      ${fld("Misconduct Code", c["Offense"])}${fld("Observed By", c["Observed By"])}
    </div>
    <h3>Statement</h3>
    <div class="stmt">${esc(c["Account"]||"")}</div>
    <div class="sig grid2">
      ${fld("Name", f["Submitted By"])}${fld("Date", (f["Submitted At"]||"").slice(0,10))}
      ${fld("USSF ID Number", "")}${fld("Phone Number", "")}
    </div>
  </div>`;
}

function checklistDoc(f){
  const fl = fails(f);
  const failed = new Set(fl.map(failNum));
  const dii = f["Division"]==="Division II";
  const DII_EXEMPT = [2,10,11];
  const rows = CHECKS.map((t,i)=>{
    const n=i+1;
    const exempt = dii && DII_EXEMPT.includes(n);
    const val = exempt ? '<span class="muted">n/a</span>'
      : failed.has(n) ? '<span class="no">NO</span>' : '<span class="yes">YES</span>';
    return `<tr><td class="n">${n}</td><td>${esc(t)}</td><td class="r">${val}</td></tr>`;
  }).join("");
  const t = teams(f);
  return `<div class="ckdoc">
    <div class="hd"><div class="t">TIMELINE AND MATCH DAY CHECKLIST</div>
      <div class="s">${esc(t.home)} v ${esc(t.away)} &nbsp;·&nbsp; ${esc(f["Kickoff"]||"")} &nbsp;·&nbsp; ${esc(f["Venue"]||"")}</div></div>
    <div class="band">UPSL&reg; FALL 2026</div>
    <table><tbody>${rows}</tbody></table>
    <div class="foot">
      <b>Athletic trainer:</b> ${esc(f["Trainer Name"]||"not recorded")}
      ${f["Trainer LAT"]?" · LAT "+esc(f["Trainer LAT"]):""}${f["Trainer Cell"]?" · "+esc(f["Trainer Cell"]):""}
      ${f["Checklist Notes"] ? `<div style="margin-top:8px"><b>Notes:</b> ${esc(f["Checklist Notes"])}</div>`:""}
    </div>
  </div>`;
}

function rosterDoc(f){
  const imgs = ["Roster Home","Roster Away"].flatMap(k=>(f[k]||[]).map(a=>
    `<img src="${a.url}" alt="${k}">`));
  if(!imgs.length) return "";
  return `<div class="doc"><div class="fed"><div class="org">Match Day</div>
    <div class="nm">Team Rosters</div></div>
    <p class="note">${esc(f["Match"]||"")} — ${esc(f["Kickoff"]||"")}</p>
    <div class="rosters">${imgs.join("")}</div></div>`;
}

/* ---------- single match ---------- */
function openMatch(id){
  const r = DATA.reports.find(x=>x.id===id); if(!r) return;
  const f = r.fields;
  const cards = kids(DATA.disc, id), subs = kids(DATA.subs, id), goals = kids(DATA.goals, id);
  const sends = cards.filter(c=>c["Card"]==="Send-off");
  $("docTitle").textContent = f["Match"]||f["Match ID"];
  $("docBody").innerHTML = refereeReport(f,cards)
    + fourthReport(f,cards,subs,goals)
    + sends.map(c=>supplemental(f,c)).join("")
    + checklistDoc(f)
    + rosterDoc(f);
  $("listView").style.display="none"; $("docs").style.display="block";
  $("backBtn").style.display="inline-block"; window.scrollTo(0,0);
}
$("backBtn").addEventListener("click", ()=>{
  $("docs").style.display="none"; $("listView").style.display="block";
  $("backBtn").style.display="none"; window.scrollTo(0,0);
});

/* ---------- weekend summary ---------- */
$("weekend").addEventListener("click", ()=>{
  const rs = DATA.reports.slice().sort((a,b)=>(a.fields["Kickoff"]||"").localeCompare(b.fields["Kickoff"]||""));
  if(!rs.length) return;

  const sendRows=[], cautRows=[], fineMap={}, resultRows=[];

  rs.forEach(r=>{
    const f=r.fields, t=teams(f);
    const cards=kids(DATA.disc,r.id), goals=kids(DATA.goals,r.id);

    cards.forEach(c=>{
      const row = {m:f["Match"], d:f["Division"], c};
      (c["Card"]==="Send-off" ? sendRows : cautRows).push(row);
    });

    fails(f).forEach(line=>{
      const n = failNum(line);
      const team = n===AWAY_ITEM ? t.away : t.home;
      (fineMap[team] = fineMap[team] || []).push({m:f["Match"], item:line.replace(/^\d+\.\s*/,"")});
    });

    resultRows.push({f, t, goals});
  });

  const sendTbl = sendRows.length ? sendRows.map(x=>`<tr>
      <td><span class="team">${esc(x.c["Player Name"])}</span> #${esc(x.c["Player Number"])}<br>
        <span class="muted">${esc(x.c["Team"])}</span></td>
      <td>${esc(x.c["Offense"])}<br><span class="muted">${esc(x.m)} · ${esc(x.d)} · ${esc(x.c["Minute"])}'</span></td>
      <td class="acct">${esc(x.c["Account"]||"")}</td></tr>`).join("")
    : `<tr><td colspan="3" class="none">No send-offs this weekend.</td></tr>`;

  const cautTbl = cautRows.length ? cautRows.map(x=>`<tr>
      <td><span class="team">${esc(x.c["Player Name"])}</span> #${esc(x.c["Player Number"])}</td>
      <td>${esc(x.c["Team"])}</td><td>${esc(x.c["Offense"])}</td>
      <td class="muted">${esc(x.m)} · ${esc(x.c["Minute"])}'</td></tr>`).join("")
    : `<tr><td colspan="4" class="none">No cautions this weekend.</td></tr>`;

  const fineTbl = Object.keys(fineMap).length ? Object.keys(fineMap).sort().map(team=>`<tr>
      <td class="team">${esc(team)}</td>
      <td>${fineMap[team].map(v=>`${esc(v.item)} <span class="muted">(${esc(v.m)})</span>`).join("<br>")}</td>
      <td style="text-align:right;font-weight:700">${fineMap[team].length}</td></tr>`).join("")
    : `<tr><td colspan="3" class="none">No checklist violations this weekend.</td></tr>`;

  const resTbl = resultRows.map(x=>{
    const gl = team => {
      const g = x.goals.filter(y=>y["Team"]===team);
      return g.length ? g.map(y=>`${esc(y["Scorer Name"])} #${esc(y["Scorer Number"])} ${esc(y["Minute"])}'`).join("<br>")
        : '<span class="muted">—</span>';
    };
    return `<tr>
      <td><span class="team">${esc(x.f["Match"])}</span><br>
        <span class="muted">${esc(x.f["Division"])} · ${esc(x.f["Kickoff"])}</span></td>
      <td style="text-align:center;font-weight:700;font-size:16px">${x.f["Home Score"]??"–"} &ndash; ${x.f["Away Score"]??"–"}</td>
      <td>${gl(x.t.home)}</td><td>${gl(x.t.away)}</td></tr>`;
  }).join("");

  $("docTitle").textContent = "Weekend summary";
  $("docBody").innerHTML = `<div class="sum">
    <div class="hd"><h1>Weekend Discipline &amp; Compliance Summary<small>UPSL NORTH CONFERENCE — FALL 2026</small></h1></div>

    <h3 class="r">Send-offs — for submission to the league</h3>
    <table><thead><tr><th>Player</th><th>Offence &amp; match</th><th>Referee's account</th></tr></thead>
      <tbody>${sendTbl}</tbody></table>

    <h3>Cautions</h3>
    <table><thead><tr><th>Player</th><th>Team</th><th>Offence</th><th>Match</th></tr></thead>
      <tbody>${cautTbl}</tbody></table>

    <h3 class="r">Checklist violations — for fines, by team</h3>
    <table><thead><tr><th>Team</th><th>Violations</th><th style="text-align:right">Count</th></tr></thead>
      <tbody>${fineTbl}</tbody></table>

    <h3>Results and goal scorers</h3>
    <table><thead><tr><th>Match</th><th style="text-align:center">Score</th><th>Home scorers</th><th>Away scorers</th></tr></thead>
      <tbody>${resTbl}</tbody></table>

    <p class="muted" style="margin-top:22px;font-size:12px">
      Compiled by LunaCore Group Assigning from reports submitted through Fifth Official.
      All checklist items are the home team's responsibility except away-team pinnies.</p>
  </div>`;
  $("listView").style.display="none"; $("docs").style.display="block";
  $("backBtn").style.display="inline-block"; window.scrollTo(0,0);
});
</script>
</body>
</html>
